build:
  backend:
    context: ./backend
  frontend:
    context: ./frontend
    target: development
  salesforce-sync:
    context: ./salesforce-sync
  thena-sync:
    context: ./thena-sync

deploy:
  - name: Deploy PostgreSQL with Helm
    command: |
      helm upgrade --install postgres ./infrastructure/postgres/chart \
        --wait

  - name: Deploy backend with Helm
    command: |
      helm upgrade --install backend ./backend/chart \
        --set image.repository=${OKTETO_BUILD_BACKEND_IMAGE%:*} \
        --set image.tag=${OKTETO_BUILD_BACKEND_IMAGE##*:} \
        --wait

  - name: Deploy frontend with Helm
    command: |
      helm upgrade --install frontend ./frontend/chart \
        --set image.repository=${OKTETO_BUILD_FRONTEND_IMAGE%:*} \
        --set image.tag=${OKTETO_BUILD_FRONTEND_IMAGE##*:} \
        --set env[0].name="VITE_BACKEND_URL" \
        --set env[0].value="https://backend-${OKTETO_NAMESPACE}.${OKTETO_DOMAIN}" \
        --wait

  - name: Deploy salesforce-sync with Helm
    command: |
      helm upgrade --install salesforce-sync ./salesforce-sync/chart \
        --set image.repository=${OKTETO_BUILD_SALESFORCE_SYNC_IMAGE%:*} \
        --set image.tag=${OKTETO_BUILD_SALESFORCE_SYNC_IMAGE##*:} \
        --set env[0].name="PORT" \
        --set env[0].value="9000" \
        --set env[1].name="SALESFORCE_CLIENT_ID" \
        --set env[1].value="${SALESFORCE_CLIENT_ID:-}" \
        --set env[2].name="SALESFORCE_USERNAME" \
        --set env[2].value="${SALESFORCE_USERNAME:-}" \
        --set env[3].name="SALESFORCE_AUD" \
        --set env[3].value="${SALESFORCE_AUD:-https://login.salesforce.com}" \
        --set env[4].name="SALESFORCE_PRIVATE_KEY_PATH" \
        --set env[4].value="/secrets/private_key.pem" \
        --set env[5].name="SALESFORCE_API_VERSION" \
        --set env[5].value="${SALESFORCE_API_VERSION:-v58.0}" \
        --wait

  - name: Deploy thena-sync with Helm
    command: |
      helm upgrade --install thena-sync ./thena-sync/chart \
        --set image.repository=${OKTETO_BUILD_THENA_SYNC_IMAGE%:*} \
        --set image.tag=${OKTETO_BUILD_THENA_SYNC_IMAGE##*:} \
        --set env[0].name="PORT" \
        --set env[0].value="9100" \
        --set env[1].name="THENA_API_KEY" \
        --set env[1].value="${THENA_API_KEY:-}" \
        --set env[2].name="THENA_BASE_URL" \
        --set env[2].value="${THENA_BASE_URL:-https://bolt.thena.ai}" \
        --wait

dev:
  backend:
    command: bash
    workdir: /app
    sync:
      - ./backend:/app
    forward:
      - 8080:8080
    environment:
      - PORT=8080

  frontend:
    command: npm run dev
    workdir: /app
    sync:
      - ./frontend:/app
    forward:
      - 3000:3000
    environment:
      - VITE_BACKEND_URL=http://backend:8080
