replicaCount: 1

image:
  repository: okteto.dev/salesforce-sync
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  annotations:
    dev.okteto.com/generate-host: "true"
  hosts:
    - paths:
      - path: /
        pathType: Prefix

# JWT Bearer OAuth Flow - Required Environment Variables
env:
  - name: PORT
    value: "9000"
  # Required for JWT Bearer Flow
  - name: SALESFORCE_CLIENT_ID
    value: ""  # Set via --set or from secret
  - name: SALESFORCE_USERNAME
    value: ""  # Set via --set or from secret
  - name: SALESFORCE_AUD
    value: "https://login.salesforce.com"  # or https://test.salesforce.com for sandbox
  - name: SALESFORCE_PRIVATE_KEY_PATH
    value: "/secrets/private_key.pem"
  # Optional - will use defaults if not set
  - name: SALESFORCE_API_VERSION
    value: "v58.0"
  - name: SALESFORCE_HTTP_TIMEOUT_MS
    value: "15000"
  - name: SALESFORCE_MAX_RETRIES
    value: "3"
  - name: SALESFORCE_BACKOFF_BASE_MS
    value: "200"
  - name: SALESFORCE_ENABLE_CACHE
    value: "false"
  - name: SALESFORCE_CACHE_TTL_SECONDS
    value: "300"

# Volume for private key secret
volumes:
  - name: salesforce-key
    secret:
      secretName: salesforce-jwt-key
      optional: true  # Don't fail if secret doesn't exist yet

volumeMounts:
  - name: salesforce-key
    mountPath: /secrets
    readOnly: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /ready
    port: 9000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 9000
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3
