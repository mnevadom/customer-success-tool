replicaCount: 1

image:
  repository: okteto.dev/salesforce-sync
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  annotations:
    dev.okteto.com/generate-host: "true"
  hosts:
    - paths:
      - path: /
        pathType: Prefix

env:
  - name: PORT
    value: "9000"
  - name: SF_USERNAME
    value: ""
  - name: SF_PASSWORD
    value: ""
  - name: SF_SECURITY_TOKEN
    value: ""
  - name: SF_LOGIN_URL
    value: "https://login.salesforce.com"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 9000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 9000
  initialDelaySeconds: 5
  periodSeconds: 5
